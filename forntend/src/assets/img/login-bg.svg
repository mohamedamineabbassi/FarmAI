    <path d="M40 220 C40 140 80 130 100 220" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.35"/>
    <circle cx="70" cy="60" r="32" fill="#ffffff" opacity="0.22"/>
    <path d="M76 32 L76 88 M42 60 H108 M54 44 L94 76 M94 44 L54 76" stroke="#7cb342" stroke-width="8" fill="none" opacity="0.95"/>
  </g>

  <g transform="translate(860,160)">
    <rect x="0" y="0" width="160" height="220" rx="28" fill="url(#towerGrad)" filter="url(#glow)"/>
    <path d="M80 0 L80 220" stroke="#4caf50" stroke-width="12"/>
    <circle cx="80" cy="40" r="16" fill="#ffffff"/>
    <path d="M80 50 L80 98" stroke="#ffffff" stroke-width="6"/>
  </g>

  <g stroke="#ffffff" stroke-width="6" fill="none" opacity="0.7">
    <path d="M940 180 C860 160 780 150 720 220"/>
    <path d="M700 220 C760 170 880 120 960 140"/>
    <path d="M860 210 C900 260 940 300 980 260"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <path d="M820 320 C840 320 860 340 860 360 C860 380 840 400 820 400 C800 400 780 380 780 360 C780 340 800 320 820 320 Z"/>
