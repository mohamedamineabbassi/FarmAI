    <path d="M910 310 L930 350 L910 390" stroke="#4caf50" stroke-width="10" fill="none"/>
  </g>

  <g transform="translate(400,390)" opacity="0.95">
    <circle cx="0" cy="0" r="64" fill="#ffffff" opacity="0.18"/>
    <path d="M-20 -10 L-10 -20 L10 -20 L20 -10 L10 0 L-10 0 Z" fill="#4caf50"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    <path d="M0 10 L0 28" stroke="#ffffff" stroke-width="6"/>
