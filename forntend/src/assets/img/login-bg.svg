<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f7ed"/>
      <stop offset="55%" stop-color="#f5fff8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcedc8"/>
      <stop offset="50%" stop-color="#b9f6ca"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86b18c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <g opacity="0.25">
    <path d="M0 680 C200 590 400 720 620 660 C840 600 980 760 1200 700 L1200 800 L0 800 Z" fill="#dcedc8"/>
    <path d="M0 720 C200 660 420 780 600 720 C780 660 980 780 1200 720 L1200 800 L0 800 Z" fill="#ffffff"/>
  </g>

  <g fill="url(#fieldGrad)" opacity="0.95">
    <path d="M0 520 C180 420 360 540 580 500 C760 470 940 560 1200 520 L1200 800 L0 800 Z"/>
    <path d="M0 560 C180 500 420 620 600 560 C780 500 980 620 1200 560 L1200 800 L0 800 Z" opacity="0.7"/>
  </g>

  <g stroke="#ffffff" stroke-width="4" opacity="0.5">
