<div class="main-content">
  <div class="container-fluid">
    
    <div class="row">
      <div class="col-md-8">
        <div class="dept-card fade-in h-100">
          <div class="card-header border-0 pb-0 px-4 pt-4 d-flex align-items-center">
            <div class="icon-wrapper mr-3" style="background: linear-gradient(135deg, #4caf50, #388e3c); padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(76,175,80,0.3);">
              <i class="material-icons text-white" style="font-size: 24px;">manage_accounts</i>
            </div>
            <div>
              <h4 class="text-dark font-weight-bold m-0" style="font-size: 18px;">MON PROFIL SÉCURISÉ</h4>
              <p class="text-muted small m-0 mt-1">Gérez vos informations personnelles et identifiants</p>
            </div>
          </div>
          <div class="card-body p-4 mt-2">
            <form>
              <div class="row mt-3">
                <div class="col-md-5">
                  <div class="form-group">
                    <label>RÔLE SYSTÈME</label>
                    <input type="text" class="form-control" disabled value="Administrateur Principal">
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-group">
                    <label>IDENTIFIANT</label>
                    <input type="text" class="form-control" value="admin_farm">
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label>ADRESSE EMAIL</label>
                    <input type="email" class="form-control" value="admin@farm-ai.com">
                  </div>
                </div>
              </div>

              <div class="row mt-4">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>PRÉNOM</label>
                    <input type="text" class="form-control" value="Admin">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label>NOM</label>
                    <input type="text" class="form-control" value="FarmAI">
                  </div>
                </div>
              </div>

              <div class="row mt-4">
                <div class="col-md-12 text-right">
                  <button type="submit" class="btn btn-save px-4">METTRE À JOUR MES INFOS</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dept-card text-center py-5 fade-in h-100 d-flex flex-column justify-content-center">
          <div class="card-body">
            <div class="icon-security-wrapper mx-auto mb-4" style="width: 100px; height: 100px; background: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #bbf7d0; box-shadow: 0 0 20px rgba(76, 175, 80, 0.1);">
              <i class="material-icons text-success" style="font-size: 50px;">face</i>
            </div>
            <h4 class="text-dark font-weight-bold mb-3" style="font-size: 18px;">BIOMÉTRIE FACIALE</h4>
            <p class="text-muted px-3 small font-weight-bold" style="line-height: 1.5;">Enregistrez votre visage pour activer l'authentification biométrique sans mot de passe.</p>
            
            <div class="mt-4 px-3">
               <button class="btn btn-save btn-block py-3 d-flex justify-content-center align-items-center mb-3" (click)="registerFace()" style="border-radius: 12px; font-size: 13px;">
                 <i class="material-icons mr-2" style="font-size: 18px;">camera_enhance</i> ENREGISTRER MON VISAGE
               </button>
               <button class="btn btn-block btn-sm d-flex justify-content-center align-items-center" (click)="deleteFace()" style="background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; border-radius: 8px; font-weight: bold; padding: 10px;">
                 <i class="material-icons mr-2" style="font-size: 16px;">delete_forever</i> SUPPRIMER MES DONNÉES BIO
               </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
